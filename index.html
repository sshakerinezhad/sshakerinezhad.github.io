  <template id="about-content">
    <div class="window-content">
      <p>Hey, I'm <strong>Shayan</strong>.</p>
      <p>I'm a Canadian Engineer and AI Researcher.</p>
      <img src="images/misc/flag.jpg" alt="salute" style="max-width: 40%;">
      <p>I've spent the last 10 years building software and hardware in a variety of domains at places like McMaster University, BMO, UofT, and Epineuron Technologies <a href="https://www.epineuron.com/products/peri-pulse">where I helped build the world first subcutaneous neurostimulator for peripheral nerve regeneration!</a>. Self taught in ML and Embodied Intelligence, currently performing research on VLAs and building robots (check out my recent work at <a href="https://merlyn-labs.com">Merlyn Labs!</a>).</p>
      <p>I love playing Warhammer 40k, D&D, and reading (check out some of the books I've read in the Stuff I've Read window).</p>
      <p>Anyway I wont drone on. Feel free to have a look around and if anything catches your fancy or you'd like to talk about robots, physics, the Horus Heresy, or anything else, hit me up.</p>
      <p></p>
    </div>
